<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081325"><meta name="robots" content="noindex,nofollow"><title>BOB Security — تطبيق الهاتف التجريبي</title><link rel="manifest" href="./mobile.webmanifest"><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#e8f5ff;background:#081325}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#081325,#102c41);min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 16px 100px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:10px}.logo img{width:42px;height:42px;object-fit:cover;border-radius:13px}.muted{color:#9eb4c7;font-size:12px}.flag{background:#2e2620;color:#ffd7a0;padding:9px 12px;border-radius:12px;margin:16px 0;font-size:12px}.hero{background:linear-gradient(135deg,#145369,#11334a);padding:22px;border:1px solid #276679;border-radius:22px;margin:18px 0}.hero h1{font-size:24px;margin:8px 0}.hero p{line-height:1.8;color:#c2e4e7;font-size:13px}.chip{display:inline-block;padding:6px 9px;border-radius:99px;background:#173a49;font-size:12px;color:#b4f5e7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{background:#11273c;border:1px solid #244157;border-radius:16px;padding:15px;margin:9px 0}.card strong{display:block;font-size:20px;margin:8px 0}.card p{color:#a5bbce;font-size:12px;line-height:1.7}.title{font-size:17px;margin:20px 0 10px}.action{display:block;width:100%;background:#16b9a0;color:#042827;border:0;border-radius:12px;padding:12px;font-weight:700;margin:9px 0}.secondary{background:#1d3c53;color:#d6f7fa;border:1px solid #38677a}.action:disabled{opacity:.5}.nav{position:fixed;bottom:0;left:0;right:0;background:#0c1d2d;border-top:1px solid #345169;display:flex;justify-content:center;padding:8px 5px max(8px,env(safe-area-inset-bottom));gap:4px}.nav button{background:transparent;color:#9bb8ca;border:0;padding:9px 13px;font-size:12px;border-radius:9px}.nav button.active{color:#59e9cc;background:#153b47}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #37546a;background:#0a1b2c;color:#fff;margin:8px 0}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #254157;font-size:13px}.line:last-child{border:0}.msg{border:1px solid #36776b;background:#123d3b;border-radius:12px;padding:13px;margin:12px 0;line-height:1.7;font-size:13px}.error{border-color:#9c5555;background:#4b242c}.links a{color:#5be1d3}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><div class="app"><header class="head"><div class="logo"><img src="./bob-logo.jpeg" alt="شعار BOB"><div><b>BOB Security</b><div class="muted">تطبيق الهاتف • معاينة</div></div></div><select id="role" class="field" style="width:145px" aria-label="وضع المعاينة"><option value="owner">شخصي</option><option value="family">الأسرة</option><option value="enterprise">المؤسسة</option></select></header><div class="flag">عرض تجريبي ببيانات وهمية • لا أجهزة حقيقية • لا قاعدة بيانات • لا دفع</div><main id="screen" aria-live="polite"></main></div><nav class="nav" aria-label="التنقل"><button data-tab="home" class="active">الرئيسية</button><button data-tab="devices">الأجهزة</button><button data-tab="incident">الحوادث</button><button data-tab="account">الحساب</button></nav><script src="./mock-api.js"></script><script>
(()=>{"use strict";let role="owner",tab="home",state=null,msg="";const el=document.getElementById("screen");const safe=x=>String(x??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const item=(a,b)=>'<div class="line"><span>'+safe(a)+'</span><b>'+safe(b)+'</b></div>';const card=s=>'<div class="card">'+s+'</div>';const btn=(s,action,secondary=false)=>'<button class="action '+(secondary?"secondary":"")+'" data-action="'+action+'">'+s+'</button>';async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-demo-role":role},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.code||"REQUEST_FAILED");return d}async function refresh(){try{state=await api("/api/bootstrap");render()}catch(e){el.textContent="تعذر تحميل بيانات المعاينة: "+e.message}}function render(){if(!state)return;let out="";if(tab==="home"){out='<section class="hero"><span class="chip">حماية بحدود الصلاحيات</span><h1>حماية جهازك تبدأ بالمعرفة</h1><p>نفحص قدرة الجهاز أولًا، ولا نعتبر الأمر ناجحًا دون نتيجة موثقة.</p></section>';if(role==="owner")out+='<div class="grid">'+card('أجهزتي<strong>'+state.devices.length+'</strong><p>أجهزة تجريبية</p>')+card('الحوادث<strong>'+state.incidents.length+'</strong><p>سجل محاكاة</p>')+'</div>'+btn("فحص حالة الجهاز","devices");else if(role==="family")out+=card('<h3>إدارة عضوية الأسرة</h3>'+item("المقاعد",state.family.seats.used+" / "+state.family.seats.total)+'<p>للبالغين 18+ فقط. لا توجد مراقبة أجهزة أو موقع أو أوامر عن بُعد لأفراد الأسرة.</p>')+btn("صياغة دعوة تجريبية","invite");else out+=card('<h3>لوحة المؤسسة المحمولة M-23</h3>'+item("أجهزة المؤسسة",state.devices.length)+item("Android Enterprise",state.enterprise.amapi)+'<p>التسجيل والسياسات الفعلية مشروطة بالأهلية والتعاقد والتحقق.</p>')+btn("مسودة سياسة","policy");}
if(tab==="devices"){out='<h2 class="title">الأجهزة وفحص القدرات</h2>';if(role==="family")out+=card('خصوصية البالغين: لا تعرض هذه المساحة أجهزة أفراد الأسرة أو بياناتها.');else out+=(state.devices||[]).map(d=>card('<h3>'+safe(d.name)+'</h3>'+item("الحالة",d.connection)+item("نظام التشغيل",d.os)+item("آخر اتصال",new Date(d.lastSeen).toLocaleString("ar-EG"))+'<p>الحالة تجريبية ولا تثبت موقعًا أو اتصالًا حقيقيًا.</p>'+btn("فحص أمر تحديث الحالة","preflight:"+d.id,true))).join("")||card("لا توجد أجهزة");}
if(tab==="incident"){out='<h2 class="title">الحوادث والاسترداد</h2>';if(role==="family")out+=card("لكل عضو بالغ حوادثه الخاصة، ولا يملك مدير الأسرة حق الاطلاع عليها.");else out+=card('<label for="subject">وصف الحادث التجريبي</label><input id="subject" class="field" maxlength="120" placeholder="مثال: فقدت هاتفي أثناء السفر">'+btn("فتح حادث وهمي","incident"))+(state.incidents||[]).map(x=>item(x.subject,x.state)).join("")+'<p>التقارير الرسمية والأدلة الرقمية والتوقيعات غير مفعلة في المعاينة.</p>');}
if(tab==="account"){out='<h2 class="title">الحساب والخصوصية</h2>'+card(item("الدور",role==="owner"?"شخصي":role==="family"?"أسرة":"مؤسسة")+item("حالة الاشتراك","تجريبي")+item("البيانات","محاكاة داخل المتصفح")+item("قاعدة البيانات","غير متصلة"))+card('<h3>حقوقك وخصوصيتك</h3><p>طلب حذف الحساب، موافقات جمع البيانات، تبديل الجهاز وإدارة الاشتراك جزء من المنتج النهائي. لا يوجد حساب حقيقي لحذفه هنا.</p>'+btn("عرض حالة الخصوصية","privacy",true));}
el.innerHTML=out+(msg?'<div class="msg" role="status">'+safe(msg)+'</div>':"");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));}
document.getElementById("role").addEventListener("change",e=>{role=e.target.value;msg="";tab="home";refresh()});document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;msg="";render()});el.addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;try{if(a==="devices"){tab="devices";msg=""}else if(a.startsWith("preflight:")){const d=await api("/api/commands/preflight",{deviceId:a.slice(10),action:"STATUS_REFRESH"});msg=d.allowed?"اجتاز فحص الواجهة فقط؛ لم يُرسل أمر لجهاز.":"القدرة غير متاحة: "+d.code}else if(a==="incident"){const subject=document.getElementById("subject").value.trim();if(subject.length<4){msg="اكتب وصفًا لا يقل عن أربعة أحرف";render();return}await api("/api/incidents",{subject});msg="تم فتح حادث تجريبي، دون إرسال تنبيه خارجي.";await refresh();return}else if(a==="invite"){msg="دعوات الأسرة للبالغين فقط؛ لا يتم إرسال بريد من هذه المعاينة."}else if(a==="policy"){const name="سياسة تجريبية "+new Date().toLocaleTimeString("ar-EG");await api("/api/enterprise/policies",{name});msg="تم حفظ مسودة سياسة فقط، دون تطبيقها على أجهزة."}else if(a==="privacy"){msg="موافقات المستخدم والحذف والتحقق من الهوية تحتاج إلى حساب وخادم وقاعدة بيانات حقيقية."}render()}catch(err){msg="لم تكتمل العملية: "+err.message;render()}});refresh()})();
</script></body></html>

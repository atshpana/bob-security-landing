name: BOB Android preview APK
on:
  push:
    branches: [feature/bob-platform-pre-db-20261115]
    paths: ['bob-platform/android/**', '.github/workflows/bob-android-preview.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: bob-platform/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOB-Android-preview-debug-APK
          path: bob-platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
